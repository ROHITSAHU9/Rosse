<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realistic 3D Rose Bloom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000; /* Dark background like video */
      color: #fff;
      font-family: 'Georgia', serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Start Card UI */
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 30px 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      width: 280px;
      z-index: 10;
      position: absolute;
    }
    .flower-icon { font-size: 35px; margin-bottom: 12px; }
    .card h2 { font-size: 20px; margin-bottom: 6px; font-weight: 600; font-family: sans-serif; }
    .card p { font-size: 13px; color: #888; margin-bottom: 25px; font-family: sans-serif; }

    #bloom-btn {
      width: 100%;
      padding: 12px 0;
      border: none;
      border-radius: 25px;
      background: #ff2a5f;
      color: white;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 42, 95, 0.6);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .hidden { display: none !important; }

    /* 3D Canvas Container */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Message Text styling like the video end */
    .message {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      font-size: 28px;
      color: #ff8fa3; /* Pinkish text */
      font-style: italic;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      text-shadow: 0 0 15px rgba(255, 143, 163, 0.7);
    }
    .message.show { opacity: 1; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="loading-box" class="card">
    <div class="flower-icon">🌹</div>
    <h2>Love.css</h2>
    <p>Ready to bloom!</p>
    <button id="bloom-btn">TAP TO BLOOM</button>
  </div>

  <div id="canvas-container" class="hidden">
    <div id="text-msg" class="message">I coded this for you 🌹</div>
  </div>

  <script>
    const bloomBtn = document.getElementById('bloom-btn');
    const loadingBox = document.getElementById('loading-box');
    const canvasContainer = document.getElementById('canvas-container');
    const textMsg = document.getElementById('text-msg');

    bloomBtn.addEventListener('click', () => {
      loadingBox.classList.add('hidden');
      canvasContainer.classList.remove('hidden');
      initRealisticRose();
    });

    function initRealisticRose() {
      // 1. Scene, Camera, Renderer Setup
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true; // Enable shadows for realism
      canvasContainer.appendChild(renderer.domElement);

      // 2. Lighting for Realism (Crucial!)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambientLight);

      const spotLight = new THREE.SpotLight(0xffffff, 1);
      spotLight.position.set(5, 10, 5);
      spotLight.castShadow = true;
      spotLight.shadow.mapSize.width = 1024;
      spotLight.shadow.mapSize.height = 1024;
      scene.add(spotLight);

      const pointLight = new THREE.PointLight(0xff0044, 1.5, 10); // Red highlight
      pointLight.position.set(-2, 2, 2);
      scene.add(pointLight);

      // 3. Realistic Materials
      const stemMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8, metalness: 0 }); // SeaGreen
      const petalMat = new THREE.MeshStandardMaterial({ 
        color: 0xd90429, // Bright Red
        roughness: 0.4, 
        metalness: 0.05,
        side: THREE.DoubleSide
      });

      // 4. Geometry & Objects

      // Stem
      const stemGeo = new THREE.CylinderGeometry(0.06, 0.06, 4, 16);
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = -3; // Start below screen
      stem.castShadow = true;
      scene.add(stem);

      // Rose Petals Group (Initial Bud State)
      const roseGroup = new THREE.Group();
      roseGroup.position.y = -1; // Position where rose will bloom
      scene.add(roseGroup);

      const petals = [];
      const petalLayers = [
        { r: 0.1, count: 4,  startRotX: 0.1,  endRotX: 1.1 }, // Inner
        { r: 0.2, count: 6,  startRotX: 0.15, endRotX: 1.0 },
        { r: 0.35, count: 8,  startRotX: 0.2,  endRotX: 0.9 },
        { r: 0.5, count: 10, startRotX: 0.25, endRotX: 0.8 }  // Outer
      ];

      petalLayers.forEach((layer, layerIdx) => {
        for (let i = 0; i < layer.count; i++) {
          const angle = (i / layer.count) * Math.PI * 2;
          
          // Petal geometry: custom shape using SphereGeometry
          const petalGeo = new THREE.SphereGeometry(
            0.3 + layerIdx * 0.1, 20, 20, 0, Math.PI, 0, Math.PI / 2
          );
          const petal = new THREE.Mesh(petalGeo, petalMat);
          
          // Scale and initial close position
          petal.scale.set(1, 1.3, 0.2); 
          petal.position.set(0, 0, 0); 
          petal.rotation.y = angle;
          petal.rotation.x = layer.startRotX; // Almost closed bud
          petal.castShadow = true;

          // Store animation targets
          petal.userData = {
            angle: angle,
            startRotX: layer.startRotX,
            endRotX: layer.endRotX,
            startRad: 0,
            endRad: layer.r,
            layer: layerIdx
          };

          roseGroup.add(petal);
          petals.push(petal);
        }
      });

      // 5. Animation Loop
      camera.position.z = 5;
      camera.position.y = 0;

      let progress = 0;
      const bloomSpeed = 0.005;

      function animate() {
        requestAnimationFrame(animate);

        if (progress < 1) {
          progress += bloomSpeed;

          // Stem grows up
          if (stem.position.y < -1.5) {
            stem.position.y += 0.02;
          }

          // Petals bloom
          petals.forEach(p => {
            const data = p.userData;
            const delay = data.layer * 0.15; // Inner layers first
            
            if (progress > delay) {
              const pProgress = Math.min((progress - delay) * 2, 1);
              
              // Rotate outward
              p.rotation.x = THREE.MathUtils.lerp(data.startRotX, data.endRotX, pProgress);
              
              // Move outward radially
              const currentRad = THREE.MathUtils.lerp(data.startRad, data.endRad, pProgress);
              p.position.x = Math.sin(data.angle) * currentRad;
              p.position.z = Math.cos(data.angle) * currentRad;
            }
          });

          // Show text at end
          if (progress >= 0.95) {
            textMsg.classList.add('show');
          }
        }

        // Slow rotation for 3D effect
        roseGroup.rotation.y += 0.003;

        renderer.render(scene, camera);
      }

      animate();

      // Handle Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
