<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blooming Flower</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000814;
display:flex;
justify-content:center;
align-items:flex-end;
height:100vh;
overflow:hidden;
}

.scene{
position:relative;
width:300px;
height:500px;
}

.stem{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:8px;
height:0;
background:#0f0;
border-radius:20px;
animation:growStem 3s forwards;
}

.leaf{
position:absolute;
width:70px;
height:30px;
background:#1aff66;
border-radius:100% 0;
opacity:0;
}

.left{
bottom:180px;
left:95px;
transform:rotate(-35deg);
animation:leafShow 1s 2.3s forwards;
}

.right{
bottom:250px;
right:95px;
transform:scaleX(-1) rotate(-35deg);
animation:leafShow 1s 2.8s forwards;
}

.flower{
position:absolute;
bottom:340px;
left:50%;
transform:translateX(-50%) scale(0);
animation:bloom .8s 3s forwards;
}

.petal{
position:absolute;
width:45px;
height:80px;
background:#ff4fa3;
border-radius:50%;
transform-origin:bottom center;
}

.p1{transform:rotate(0deg) translateY(-35px);}
.p2{transform:rotate(45deg) translateY(-35px);}
.p3{transform:rotate(90deg) translateY(-35px);}
.p4{transform:rotate(135deg) translateY(-35px);}
.p5{transform:rotate(180deg) translateY(-35px);}
.p6{transform:rotate(225deg) translateY(-35px);}
.p7{transform:rotate(270deg) translateY(-35px);}
.p8{transform:rotate(315deg) translateY(-35px);}

.center{
position:absolute;
width:35px;
height:35px;
background:gold;
border-radius:50%;
left:5px;
top:5px;
}

@keyframes growStem{
100%{height:350px;}
}

@keyframes bloom{
100%{
transform:translateX(-50%) scale(1);
}
}

@keyframes leafShow{
to{
opacity:1;
}
}
</style>
</head>

<body>

<div class="scene">

<div class="stem"></div>

<div class="leaf left"></div>
<div class="leaf right"></div>

<div class="flower">

<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>
<div class="petal p5"></div>
<div class="petal p6"></div>
<div class="petal p7"></div>
<div class="petal p8"></div>

<div class="center"></div>

</div>

</div>

</body>
</html>
