<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I coded this for you 🌹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    .container {
      position: relative;
      width: 320px;
      height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 1. Stem Animation */
    .stem {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: growStem 2s forwards ease-in-out;
    }

    @keyframes growStem {
      to { stroke-dashoffset: 0; }
    }

    /* 2. Leaves Animation */
    .leaf {
      opacity: 0;
      transform-origin: center;
      animation: bloomLeaf 1s forwards ease-out;
    }

    .leaf-left { animation-delay: 1.5s; }
    .leaf-right { animation-delay: 1.8s; }

    @keyframes bloomLeaf {
      0% { opacity: 0; transform: scale(0) rotate(-10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* 3. Rose Bud to Bloom (Inside-Out) */
    .petal {
      opacity: 0;
      transform-origin: 160px 210px;
      animation: bloomPetal 1.5s forwards ease-out;
    }

    /* Inside Petals (कली का अंदर का हिस्सा सबसे पहले) */
    .p-core  { animation-delay: 2.2s; }
    .p-inner { animation-delay: 2.6s; }
    .p-mid   { animation-delay: 3.1s; }
    .p-outer { animation-delay: 3.6s; }

    @keyframes bloomPetal {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(var(--r-start, 0deg));
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(var(--r-end, 0deg));
      }
    }

    /* 4. Text Animation */
    .message {
      position: absolute;
      bottom: 20px;
      color: #ff5277;
      font-size: 22px;
      font-style: italic;
      text-align: center;
      opacity: 0;
      animation: fadeInText 1.5s 4.3s forwards ease-in-out;
      text-shadow: 0 0 12px rgba(255, 82, 119, 0.4);
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <svg viewBox="0 0 320 480">
      <defs>
        <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#113816"/>
          <stop offset="100%" stop-color="#2e8b57"/>
        </linearGradient>

        <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff3b65"/>
          <stop offset="60%" stop-color="#ba0029"/>
          <stop offset="100%" stop-color="#540012"/>
        </linearGradient>

        <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ff4d73"/>
          <stop offset="100%" stop-color="#8a001d"/>
        </linearGradient>
      </defs>

      <path class="stem" d="M 160 400 Q 158 300 160 200" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round" fill="none" />

      <g class="leaf leaf-left">
        <path d="M 158 320 C 120 310 100 280 110 260 C 130 260 150 290 158 320 Z" fill="#2e8b57" />
      </g>
      <g class="leaf leaf-right">
        <path d="M 162 280 C 200 270 220 240 210 220 C 190 220 170 250 162 280 Z" fill="#247346" />
      </g>

      <g class="leaf leaf-left">
        <path d="M 160 205 C 145 200 135 210 130 225 C 145 215 155 210 160 205 Z" fill="#2e8b57" />
        <path d="M 160 205 C 175 200 185 210 190 225 C 175 215 165 210 160 205 Z" fill="#2e8b57" />
      </g>

      <path class="petal p-outer" style="--r-start: -20deg; --r-end: -45deg;" d="M 160 210 C 100 180 90 120 135 100 C 170 120 180 180 160 210 Z" fill="url(#petalGrad1)" />
      <path class="petal p-outer" style="--r-start: 20deg; --r-end: 45deg;" d="M 160 210 C 220 180 230 120 185 100 C 150 120 140 180 160 210 Z" fill="url(#petalGrad1)" />

      <path class="petal p-mid" style="--r-start: -10deg; --r-end: -25deg;" d="M 160 210 C 115 170 110 125 145 110 C 175 125 170 170 160 210 Z" fill="url(#petalGrad2)" />
      <path class="petal p-mid" style="--r-start: 10deg; --r-end: 25deg;" d="M 160 210 C 205 170 210 125 175 110 C 145 125 150 170 160 210 Z" fill="url(#petalGrad2)" />

      <path class="petal p-inner" style="--r-start: -5deg; --r-end: -12deg;" d="M 160 210 C 130 160 125 130 150 120 C 175 130 170 160 160 210 Z" fill="url(#petalGrad1)" />
      <path class="petal p-inner" style="--r-start: 5deg; --r-end: 12deg;" d="M 160 210 C 190 160 195 130 170 120 C 145 130 150 160 160 210 Z" fill="url(#petalGrad1)" />

      <path class="petal p-core" style="--r-start: 0deg; --r-end: 0deg;" d="M 160 210 C 142 165 145 138 160 132 C 175 138 178 165 160 210 Z" fill="url(#petalGrad2)" />
    </svg>

    <div class="message">I coded this for you 🌹</div>
  </div>

</body>
</html>
