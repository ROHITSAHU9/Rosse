<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love.css - 3D Bloom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Start UI Box */
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 30px 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      width: 280px;
      z-index: 10;
      position: absolute;
    }
    .flower-icon { font-size: 35px; margin-bottom: 12px; }
    .card h2 { font-size: 20px; margin-bottom: 6px; font-weight: 600; }
    .card p { font-size: 13px; color: #888; margin-bottom: 25px; }

    #bloom-btn {
      width: 100%;
      padding: 12px 0;
      border: none;
      border-radius: 25px;
      background: #ff2a5f;
      color: white;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 42, 95, 0.6);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .hidden { display: none !important; }

    /* 3D Canvas Container */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .message {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      font-size: 24px;
      color: #ff5e83;
      font-family: 'Georgia', serif;
      font-style: italic;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      text-shadow: 0 0 10px rgba(255, 94, 131, 0.6);
    }
    .message.show { opacity: 1; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="loading-box" class="card">
    <div class="flower-icon">🌹</div>
    <h2>Love.css</h2>
    <p>Ready to bloom!</p>
    <button id="bloom-btn">TAP TO BLOOM</button>
  </div>

  <div id="canvas-container" class="hidden">
    <div id="text-msg" class="message">I coded this for you 🌹</div>
  </div>

  <script>
    const bloomBtn = document.getElementById('bloom-btn');
    const loadingBox = document.getElementById('loading-box');
    const canvasContainer = document.getElementById('canvas-container');
    const textMsg = document.getElementById('text-msg');

    bloomBtn.addEventListener('click', () => {
      loadingBox.classList.add('hidden');
      canvasContainer.classList.remove('hidden');
      init3DRose();
    });

    function init3DRose() {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      canvasContainer.appendChild(renderer.domElement);

      // Lighting Setup
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      const redLight = new THREE.PointLight(0xff0044, 2, 10);
      redLight.position.set(0, 2, 2);
      scene.add(redLight);

      // 1. Stem (Green Cylinder)
      const stemGeo = new THREE.CylinderGeometry(0.08, 0.08, 4, 32);
      const stemMat = new THREE.MeshStandardMaterial({ color: 0x1b4d1b, roughness: 0.6 });
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = -3;
      scene.add(stem);

      // 2. Rose Petals Group
      const roseGroup = new THREE.Group();
      roseGroup.position.y = -1;
      scene.add(roseGroup);

      const petalMat = new THREE.MeshStandardMaterial({
        color: 0xc9002b,
        roughness: 0.3,
        metalness: 0.1,
        side: THREE.DoubleSide
      });

      const petals = [];
      const layers = 5;
      
      for (let l = 0; l < layers; l++) {
        const count = 5 + l * 3;
        const radius = 0.2 + l * 0.15;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + (l * 0.5);
          
          const petalGeo = new THREE.SphereGeometry(
            0.4 + l * 0.1, 16, 16, 0, Math.PI, 0, Math.PI / 2
          );
          
          const petal = new THREE.Mesh(petalGeo, petalMat);
          petal.scale.set(1, 1.2, 0.3);
          
          // Initial Closed State
          petal.position.set(0, 0, 0);
          petal.rotation.y = angle;
          petal.rotation.x = 0.2;

          petal.userData = {
            targetRotX: 0.8 + (l * 0.15),
            targetRad: radius,
            layer: l,
            angle: angle
          };

          roseGroup.add(petal);
          petals.push(petal);
        }
      }

      camera.position.z = 5;
      camera.position.y = 0;

      let progress = 0;

      function animate() {
        requestAnimationFrame(animate);

        if (progress < 1) {
          progress += 0.008;

          // Animate Stem Growing Up
          if (stem.position.y < -1) {
            stem.position.y += 0.02;
          }

          // Animate Petals Blooming Outward
          petals.forEach(p => {
            const delay = p.userData.layer * 0.15;
            if (progress > delay) {
              const pProgress = Math.min((progress - delay) * 2, 1);
              
              p.rotation.x = THREE.MathUtils.lerp(0.2, p.userData.targetRotX, pProgress);
              
              const currentRad = THREE.MathUtils.lerp(0, p.userData.targetRad, pProgress);
              p.position.x = Math.sin(p.userData.angle) * currentRad;
              p.position.z = Math.cos(p.userData.angle) * currentRad;
            }
          });

          if (progress >= 0.9) {
            textMsg.classList.add('show');
          }
        }

        // Slow rotation for 3D view
        roseGroup.rotation.y += 0.005;

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
